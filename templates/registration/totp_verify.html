{% extends "base.html" %}
{% block title %}Enter 2FA code — Beauto{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card-beauto text-center">
      <h3 class="mb-1">Step 2 of 2</h3>
      <p class="text-muted small mb-3">Enter the current 6-digit code from your authenticator app.</p>
      <form method="post" novalidate class="text-start">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">{{ form.code.label }}</label>
          {{ form.code }}
          {% for error in form.code.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
        <button type="submit" class="btn btn-beauto w-100">Verify &amp; sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
