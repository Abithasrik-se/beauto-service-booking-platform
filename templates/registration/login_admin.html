{% extends "base.html" %}
{% block title %}Admin login — Beauto{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card-beauto">
      <h3 class="mb-1">Admin login</h3>
      <p class="text-muted small mb-3">Step 1 of 2 — password, then a 2FA code from your authenticator app.</p>
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-beauto w-100">Continue</button>
      </form>
      <p class="text-muted small mt-3 mb-0">
        <a href="{% url 'accounts:login_customer' %}">Customer login</a> ·
        <a href="{% url 'accounts:login_beautician' %}">Beautician login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
