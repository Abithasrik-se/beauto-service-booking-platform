{% extends "base.html" %}
{% block title %}Invalid link — Beauto{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 text-center">
    <div class="card-beauto">
      <h3>This link is invalid or expired</h3>

      <a href="{% url 'accounts:signup_landing' %}" class="btn btn-outline-beauto">Back to sign up</a>
    </div>
  </div>
</div>
{% endblock %}
